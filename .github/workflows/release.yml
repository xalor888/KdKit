name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: module
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: module
        run: ./gradlew --no-daemon assembleDebug

      - name: Name artifact after the tag
        run: |
          set -euo pipefail
          cp module/app/build/outputs/apk/debug/app-debug.apk "KdKit-${GITHUB_REF_NAME}.apk"
          ls -l "KdKit-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: KdKit-*.apk
          generate_release_notes: true
          draft: false
